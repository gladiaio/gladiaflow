[package]
name = "gladiaflow"
version = "0.1.0"
description = "A Tauri App for real-time voice dictation with Gladia"
authors = ["Gladia <support@gladia.io>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = ">=2.6.1, <3", features = [] }

[dependencies]
tauri = { version = ">=2.11.1, <3", features = [ "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "native-tls"] }
tokio-util = { version = "0.7", features = ["io"] }
cpal = "=0.17.3"
thiserror = "2"
anyhow = "1"
url = "2"
futures-util = "0.3"
async-broadcast = "0.7"
crossbeam-channel = "0.5"
arc-swap = "1.7"
base64 = "0.22.1"
dirs = "6"
iana-time-zone = "0.1"
arboard = "3"
log = "0.4"
tauri-plugin-log = "2"
open = { version = "5", features = ["shellexecute-on-windows"] }
rusqlite = { version = "0.40", features = ["bundled"] }
nucleo-matcher = "0.3.1"
chrono = { version = "0.4.45", features = ["serde"] }
stop-words = "0.10"
tauri-plugin-notification = "2"
# OpenPII-style on-device NER for screen-context vocabulary (optional model dir).
ort = { version = "=2.0.0-rc.10", default-features = true, features = ["ndarray"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ndarray = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
foreign-types = "0.5"
coreaudio-rs = "0.14"
objc2 = "0.5"
block2 = "0.5"
objc2_06 = { package = "objc2", version = "0.6" }
block2_06 = { package = "block2", version = "0.6" }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNUserNotificationCenter", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.3"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
