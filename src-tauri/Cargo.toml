[package]
name = "gladiaflow"
version = "1.2.0"
description = "A Tauri App for real-time voice dictation with Gladia"
authors = ["Gladia <support@gladia.io>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = ">=2.6.1, <3", features = [] }

[dependencies]
tauri = { version = ">=2.11.1, <3", features = [ "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "native-tls"] }
tokio-util = { version = "0.7", features = ["io"] }
cpal = "=0.18.2"
thiserror = "2"
anyhow = "1"
url = "2"
futures-util = "0.3"
async-broadcast = "0.7"
crossbeam-channel = "0.5"
arc-swap = "1.7"
base64 = "0.22.1"
dirs = "6"
iana-time-zone = "0.1"
arboard = "3"
log = "0.4"
tauri-plugin-log = "2"
open = { version = "5", features = ["shellexecute-on-windows"] }
rusqlite = { version = "0.40", features = ["bundled"] }
nucleo-matcher = "0.3.1"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-notification = "2"
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
coreaudio-rs = "0.14"
screencapturekit = { version = "11", default-features = false, features = ["macos_13_0"] }
objc2 = "0.5"
block2 = "0.5"
objc2_06 = { package = "objc2", version = "0.6" }
block2_06 = { package = "block2", version = "0.6" }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNUserNotificationCenter", "block2"] }
highlandcows-eventkit = "0.5.8"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.3"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
